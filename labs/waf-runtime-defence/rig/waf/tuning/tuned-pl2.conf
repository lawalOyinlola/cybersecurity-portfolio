# CRS exclusions that run BEFORE the core rules. Each one names the rule it
# addresses, the legitimate traffic it unblocks, and the detection it gives up.
# Exclusions are targeted, never a lower paranoia level.

# -----------------------------------------------------------------------------
# EXCL-1  Allow the REST verbs on the API (rule 911100, method enforcement)
# -----------------------------------------------------------------------------
# CRS ships allowing GET, HEAD, POST and OPTIONS only. The shop updates and
# deletes basket items with PUT and DELETE, so every one of those was scored.
# Scoped to /api/ and /rest/ so the rest of the site keeps the strict default.
# CRS only sets its default when tx.allowed_methods is unset, so setting it in
# phase 1, before rule 901 runs, makes 901 leave it alone.
#
# Gives up: the method check on those two prefixes. Each route authenticates
# and validates on its own, so the verb adds nothing here.
SecRule REQUEST_URI "@rx ^/(api|rest)/" \
  "id:1000001,\
   phase:1,\
   pass,\
   nolog,\
   t:none,\
   setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# -----------------------------------------------------------------------------
# EXCL-2  Passwords may contain SQL-looking characters (rule 942540)
# -----------------------------------------------------------------------------
# A strong password such as  P@ss'w0rd!";--  matches the SQL authentication
# bypass rule. Excluded for the two password fields on the two endpoints that
# accept one, and nowhere else: the email field and every other endpoint are
# still inspected by this rule.
#
# Gives up: this one rule, on those two fields. A SQL injection sent in the
# password field is now invisible to it (other SQLi rules still apply).
SecRule REQUEST_URI "@rx ^/(api/Users|rest/user/login)$" \
  "id:1000002,\
   phase:1,\
   pass,\
   nolog,\
   t:none,\
   ctl:ruleRemoveTargetById=942540;ARGS:json.password,\
   ctl:ruleRemoveTargetById=942540;ARGS:json.passwordRepeat"

# =============================================================================
# Added for paranoia level 2
# =============================================================================

# -----------------------------------------------------------------------------
# EXCL-3  Passwords again, at paranoia level 2 (942180, 942340, 942440)
# -----------------------------------------------------------------------------
# Level 2 adds three more SQL rules that match the same strong password: the
# authentication bypass patterns (942180, 942340) and the SQL comment sequence
# (942440, which the ";-- in the password literally is). Same two fields, same
# two endpoints, as EXCL-2.
#
# Gives up: three more rules on those two fields.
SecRule REQUEST_URI "@rx ^/(api/Users|rest/user/login)$" \
  "id:1000003,\
   phase:1,\
   pass,\
   nolog,\
   t:none,\
   ctl:ruleRemoveTargetById=942180;ARGS:json.password,\
   ctl:ruleRemoveTargetById=942180;ARGS:json.passwordRepeat,\
   ctl:ruleRemoveTargetById=942340;ARGS:json.password,\
   ctl:ruleRemoveTargetById=942340;ARGS:json.passwordRepeat,\
   ctl:ruleRemoveTargetById=942440;ARGS:json.password,\
   ctl:ruleRemoveTargetById=942440;ARGS:json.passwordRepeat"

# -----------------------------------------------------------------------------
# EXCL-4  Free text in a review (932200, 942210)
# -----------------------------------------------------------------------------
# "Love it! A&B Juice, it's 5/5 and 100% worth it." trips the RCE bypass rule
# (932200) and the chained SQL injection rule (942210). Reviews are ordinary
# prose, so the message field is excluded from those two rules, on the review
# endpoint only.
#
# Gives up: those two rules on the review message. Stored XSS in the same field
# is still caught, since the XSS rules are untouched.
SecRule REQUEST_URI "@rx ^/rest/products/[0-9]+/reviews$" \
  "id:1000004,\
   phase:1,\
   pass,\
   nolog,\
   t:none,\
   ctl:ruleRemoveTargetById=932200;ARGS:json.message,\
   ctl:ruleRemoveTargetById=942210;ARGS:json.message"
