# CRS exclusions applied BEFORE the core rules run.
#
# Each entry names the rule it addresses, the legitimate traffic it unblocks,
# and why the change is safe. Exclusions are targeted, never a wholesale
# paranoia-level reduction.

# -----------------------------------------------------------------------------
# EXCL-1  Restore the REST verbs (rule 911100, method enforcement)
# -----------------------------------------------------------------------------
# Detection (Phase 2) and blocking (Phase 3) measured CRS rule 911100 ("Method
# is not allowed by policy") firing on every PATCH and DELETE: the CRS default
# allowed-method set is GET/HEAD/POST/OPTIONS. It was confirmed a false positive
# on ordinary traffic: legitimate PATCH requests to /api/vehicles/:id and
# /api/users/:id (cases N8, N9) were blocked 403 with the engine on, and
# returned 200 through the no-WAF control.
#
# This is a REST API that uses PATCH and DELETE across users, vehicles, devices,
# geofences, organizations, report schedules and more. Method enforcement adds
# no security here: the verbs are part of the API contract, each route is
# already authenticated, authorised and DTO-validated, and blocking them breaks
# core functionality without closing any attack path. Restoring the standard
# REST verb set is the textbook first CRS tuning step in front of a modern API.
#
# crs-setup.conf rule 900200 (which would set this) ships commented out, so
# REQUEST-901-INITIALIZATION sets the GET/HEAD/POST/OPTIONS default only when
# the variable is unset. Setting it here, in the BEFORE-CRS phase-1 file that
# loads ahead of 901, makes 901 skip its default and this value stands.
SecAction \
  "id:9001001,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"
