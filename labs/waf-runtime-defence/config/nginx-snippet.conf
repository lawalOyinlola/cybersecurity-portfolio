# NGINX + ModSecurity edge, single origin, path-routed.
#
# TLS terminates here, ModSecurity inspects the decrypted request, and the
# request is then proxied to one of two upstreams by path: /api/* to the API,
# everything else to the frontend. Serving both from one origin is deliberate,
# not a shortcut: the application's own Content-Security-Policy allowlists its
# API host under connect-src, so a split-origin layout would have the browser
# block every API call before the WAF ever saw it. Same origin keeps the app's
# real CSP intact and puts the WAF genuinely in-path.
#
# Derived from the deployment's production NGINX, reduced to the parts that
# matter for the WAF. Hostnames and certificate paths are lab values.

server {
    listen 8443 ssl;
    server_name app.lab.localhost;

    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ModSecurity is enabled at the http{} level by the base image; these are
    # the settings that actually shaped the results (see modsecurity.conf).

    # API surface: NestJS, mounted under /api by the app's global prefix, so
    # the URI passes through unrewritten.
    location /api/ {
        client_max_body_size 0;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Authorization;
        proxy_pass http://api_upstream;
    }

    # Everything else: the frontend.
    location / {
        client_max_body_size 0;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://frontend_upstream;
    }
}
