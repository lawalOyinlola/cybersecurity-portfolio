# ModSecurity settings that shaped the measurement.
#
# Only the directives that materially affected results are shown. Phase 1 ran
# with the engine off as a control; Phase 2 with DetectionOnly; Phase 3 with On.
# The paranoia axis is the OWASP CRS BLOCKING_PARANOIA / detection paranoia
# pair, tested at level 1 (the operating point chosen) and level 2.

# --- engine (varied by phase) -----------------------------------------------
# SecRuleEngine Off             ; Phase 1 baseline (control, no inspection)
# SecRuleEngine DetectionOnly   ; Phase 2 (log would-be blocks, break nothing)
SecRuleEngine On                ; Phase 3

# --- request body inspection ------------------------------------------------
# Mandatory here: the API is JSON end to end. Without body access the WAF is
# blind to nearly every payload, since they arrive in POST/PATCH bodies rather
# than the query string.
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

# --- response body inspection -----------------------------------------------
SecResponseBodyAccess On

# --- audit logging ----------------------------------------------------------
# JSON, relevant-only, so results are parsed from evidence rather than tallied
# by hand. Every figure in the writeup is reproducible from this log.
SecAuditEngine RelevantOnly
SecAuditLogFormat JSON
SecAuditLogParts ABIJDEFHKZ
SecAuditLog /var/log/modsec/audit.log

# --- OWASP Core Rule Set ----------------------------------------------------
# Loaded after this file. Operating point: paranoia level 1, inbound anomaly
# threshold 5. See crs-exclusions.conf for the one tuning applied.
