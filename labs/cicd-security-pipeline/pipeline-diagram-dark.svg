<svg viewBox="0 0 980 680" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="680" fill="#151a2b"/>

  <text x="40" y="44" font-size="22" font-weight="700" fill="#f2f1ec">Security pipeline</text>
  <text x="40" y="68" font-size="13.5" fill="#9aa1b8">Five scan jobs on three triggers. Additive, and independently disableable.</text>
  <line x1="40" y1="84" x2="940" y2="84" stroke="#f2c230" stroke-width="2"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9aa1b8"/>
    </marker>
  </defs>

  <!-- triggers -->
  <g>
    <rect x="205" y="110" width="170" height="34" rx="17" fill="#f2c230"/>
    <text x="290" y="132" font-size="13" font-weight="700" fill="#151a2b" text-anchor="middle">Pull request</text>

    <rect x="405" y="110" width="170" height="34" rx="17" fill="#f2c230"/>
    <text x="490" y="132" font-size="13" font-weight="700" fill="#151a2b" text-anchor="middle">Push to main</text>

    <rect x="605" y="110" width="170" height="34" rx="17" fill="#f2c230"/>
    <text x="690" y="132" font-size="13" font-weight="700" fill="#151a2b" text-anchor="middle">Weekly schedule</text>
  </g>

  <!-- triggers converge to a single trunk -->
  <g stroke="#9aa1b8" stroke-width="1.6" fill="none">
    <line x1="290" y1="144" x2="290" y2="170"/>
    <line x1="490" y1="144" x2="490" y2="170"/>
    <line x1="690" y1="144" x2="690" y2="170"/>
    <line x1="290" y1="170" x2="690" y2="170"/>
    <line x1="490" y1="170" x2="490" y2="196"/>
    <!-- fan out to five jobs -->
    <line x1="124" y1="196" x2="856" y2="196"/>
    <line x1="124" y1="196" x2="124" y2="220" marker-end="url(#arrow)"/>
    <line x1="307" y1="196" x2="307" y2="220" marker-end="url(#arrow)"/>
    <line x1="490" y1="196" x2="490" y2="220" marker-end="url(#arrow)"/>
    <line x1="673" y1="196" x2="673" y2="220" marker-end="url(#arrow)"/>
    <line x1="856" y1="196" x2="856" y2="220" marker-end="url(#arrow)"/>
  </g>
  <text x="920" y="188" font-size="11" fill="#9aa1b8" font-style="italic" text-anchor="end">five jobs, run in parallel</text>

  <!-- scan jobs -->
  <g>
    <rect x="40" y="222" width="168" height="92" rx="6" fill="#1e2438" stroke="#9aa1b8" stroke-width="2"/>
    <text x="124" y="252" font-size="14" font-weight="700" fill="#f2f1ec" text-anchor="middle">Static analysis</text>
    <text x="124" y="274" font-size="10.5" fill="#9aa1b8" text-anchor="middle">application source</text>
    <text x="124" y="291" font-size="10.5" fill="#9aa1b8" text-anchor="middle">OWASP, TS, React rule sets</text>

    <rect x="223" y="222" width="168" height="92" rx="6" fill="#1e2438" stroke="#9aa1b8" stroke-width="2"/>
    <text x="307" y="252" font-size="14" font-weight="700" fill="#f2f1ec" text-anchor="middle">Dependencies</text>
    <text x="307" y="274" font-size="10.5" fill="#9aa1b8" text-anchor="middle">backend project</text>
    <text x="307" y="291" font-size="10.5" fill="#9aa1b8" text-anchor="middle">production and dev scope</text>

    <rect x="406" y="222" width="168" height="92" rx="6" fill="#1e2438" stroke="#9aa1b8" stroke-width="2"/>
    <text x="490" y="252" font-size="14" font-weight="700" fill="#f2f1ec" text-anchor="middle">Dependencies</text>
    <text x="490" y="274" font-size="10.5" fill="#9aa1b8" text-anchor="middle">frontend project</text>
    <text x="490" y="291" font-size="10.5" fill="#9aa1b8" text-anchor="middle">production and dev scope</text>

    <rect x="589" y="222" width="168" height="92" rx="6" fill="#1e2438" stroke="#9aa1b8" stroke-width="2"/>
    <text x="673" y="252" font-size="14" font-weight="700" fill="#f2f1ec" text-anchor="middle">Upstream images</text>
    <text x="673" y="274" font-size="10.5" fill="#9aa1b8" text-anchor="middle">pinned third-party images</text>
    <text x="673" y="291" font-size="10.5" fill="#9aa1b8" text-anchor="middle">read from a tracked manifest</text>

    <rect x="772" y="222" width="168" height="92" rx="6" fill="#1e2438" stroke="#9aa1b8" stroke-width="2"/>
    <text x="856" y="252" font-size="14" font-weight="700" fill="#f2f1ec" text-anchor="middle">Secrets</text>
    <text x="856" y="274" font-size="10.5" fill="#9aa1b8" text-anchor="middle">full git history</text>
    <text x="856" y="291" font-size="10.5" fill="#9aa1b8" text-anchor="middle">not just the working tree</text>
  </g>

  <!-- jobs converge into the report -->
  <g stroke="#9aa1b8" stroke-width="1.6" fill="none">
    <line x1="124" y1="314" x2="124" y2="348"/>
    <line x1="307" y1="314" x2="307" y2="348"/>
    <line x1="490" y1="314" x2="490" y2="348"/>
    <line x1="673" y1="314" x2="673" y2="348"/>
    <line x1="856" y1="314" x2="856" y2="348"/>
    <line x1="124" y1="348" x2="856" y2="348"/>
    <line x1="490" y1="348" x2="490" y2="372" marker-end="url(#arrow)"/>
  </g>

  <!-- report -->
  <rect x="215" y="374" width="550" height="62" rx="6" fill="#0f1322" stroke="#f2c230" stroke-width="3"/>
  <text x="490" y="400" font-size="14" font-weight="700" fill="#f2f1ec" text-anchor="middle">Job summary and pull request comment</text>
  <text x="490" y="420" font-size="10.5" fill="#9aa1b8" text-anchor="middle">no native security dashboard on this plan, so results surface where the team already looks</text>

  <!-- policy gate -->
  <line x1="490" y1="436" x2="490" y2="454" stroke="#9aa1b8" stroke-width="1.6"/>
  <rect x="422" y="454" width="136" height="24" rx="12" fill="#0f1322" stroke="#9aa1b8" stroke-width="1.2"/>
  <text x="490" y="470" font-size="11.5" font-weight="700" fill="#9aa1b8" text-anchor="middle">severity policy</text>

  <g stroke="#9aa1b8" stroke-width="1.6" fill="none">
    <line x1="490" y1="478" x2="490" y2="494"/>
    <line x1="260" y1="494" x2="720" y2="494"/>
    <line x1="260" y1="494" x2="260" y2="514" marker-end="url(#arrow)"/>
    <line x1="720" y1="494" x2="720" y2="514" marker-end="url(#arrow)"/>
  </g>

  <!-- block -->
  <rect x="70" y="516" width="380" height="104" rx="6" fill="#2a1d24" stroke="#ef6a4c" stroke-width="2"/>
  <text x="260" y="544" font-size="14" font-weight="700" fill="#ef6a4c" text-anchor="middle">Blocks the build</text>
  <text x="260" y="567" font-size="11.5" fill="#d5d7e0" text-anchor="middle">any secret finding</text>
  <text x="260" y="585" font-size="11.5" fill="#d5d7e0" text-anchor="middle">critical dependency finding with a published fix</text>
  <text x="260" y="603" font-size="11.5" fill="#d5d7e0" text-anchor="middle">ERROR-severity static analysis finding</text>

  <!-- warn -->
  <rect x="530" y="516" width="380" height="104" rx="6" fill="#1b2a26" stroke="#5fc48a" stroke-width="2"/>
  <text x="720" y="544" font-size="14" font-weight="700" fill="#5fc48a" text-anchor="middle">Warns, does not block</text>
  <text x="720" y="567" font-size="11.5" fill="#d5d7e0" text-anchor="middle">everything else, tracked to a review date</text>
  <text x="720" y="585" font-size="11.5" fill="#d5d7e0" text-anchor="middle">tightens as the fixable backlog shrinks</text>

  <text x="40" y="656" font-size="11.5" fill="#9aa1b8">Severity policy set against the measured baseline, not tool defaults. Disabling this workflow changes nothing about how the team builds or deploys.</text>
</svg>
