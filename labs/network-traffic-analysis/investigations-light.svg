<svg viewBox="0 0 880 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Four network-traffic investigations, each from evidence to root cause to control. DNS outage: a tcpdump DNS and ICMP capture shows the DNS server reachable but silent on port 53, handled by service and firewall diagnosis. SYN flood: a Wireshark TCP capture shows a single-source flood of half-open connections, contained by blocking the IP, which spoofing can bypass. Brute force and malware redirect: a capture and source review show a guessed default admin password and injected redirect, closed by MFA on privileged logins. ICMP flood: an ICMP capture against an unconfigured firewall, prevented by rate limiting and ICMP filtering.">
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#1a3c5e">From capture to control: four investigations</text>
  <text x="40" y="64" font-size="13" fill="#555555">Each raw packet capture read as a sequence, traced from symptom to root cause to a proportionate control.</text>
  <line x1="40" y1="80" x2="840" y2="80" stroke="#c99a2e" stroke-width="2"/>

  <!-- column headers -->
  <text x="40"  y="106" font-size="11" font-weight="700" fill="#8a6d1a" letter-spacing="1.2">EVIDENCE</text>
  <text x="330" y="106" font-size="11" font-weight="700" fill="#8a6d1a" letter-spacing="1.2">ROOT CAUSE</text>
  <text x="650" y="106" font-size="11" font-weight="700" fill="#8a6d1a" letter-spacing="1.2">KEY CONTROL</text>

  <!-- arrow marker -->
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L5,3 L0,6 Z" fill="#9aa7b8"/></marker></defs>

  <!-- rows -->
  <g font-size="12">
    <!-- row 1 DNS -->
    <rect x="40" y="120" width="260" height="60" rx="7" fill="#f7f9fb" stroke="#c8d3e0"/>
    <text x="54" y="144" fill="#333333">tcpdump DNS / ICMP</text>
    <text x="54" y="162" fill="#777777">website unreachable</text>
    <line x1="302" y1="150" x2="326" y2="150" stroke="#9aa7b8" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="330" y="120" width="290" height="60" rx="7" fill="#ffffff" stroke="#c8d3e0"/>
    <text x="344" y="144" font-weight="700" fill="#1a3c5e">DNS reachable but silent on :53</text>
    <text x="344" y="162" fill="#777777">name resolution never completes</text>
    <line x1="622" y1="150" x2="646" y2="150" stroke="#9aa7b8" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="650" y="120" width="190" height="60" rx="7" fill="#f4f7f1" stroke="#bcd0bc"/>
    <text x="664" y="150" font-weight="700" fill="#2e7d46">Service + firewall</text>
    <text x="664" y="167" fill="#333333">check on port 53</text>

    <!-- row 2 SYN -->
    <rect x="40" y="192" width="260" height="60" rx="7" fill="#f7f9fb" stroke="#c8d3e0"/>
    <text x="54" y="216" fill="#333333">Wireshark TCP / HTTP</text>
    <text x="54" y="234" fill="#777777">monitoring alert</text>
    <line x1="302" y1="222" x2="326" y2="222" stroke="#9aa7b8" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="330" y="192" width="290" height="60" rx="7" fill="#ffffff" stroke="#c8d3e0"/>
    <text x="344" y="216" font-weight="700" fill="#1a3c5e">SYN flood from one source</text>
    <text x="344" y="234" fill="#777777">half-open connections exhaust the server</text>
    <line x1="622" y1="222" x2="646" y2="222" stroke="#9aa7b8" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="650" y="192" width="190" height="60" rx="7" fill="#f4f7f1" stroke="#bcd0bc"/>
    <text x="664" y="222" font-weight="700" fill="#2e7d46">Block the IP</text>
    <text x="664" y="239" fill="#333333">temporary; spoofable</text>

    <!-- row 3 brute force -->
    <rect x="40" y="264" width="260" height="60" rx="7" fill="#f7f9fb" stroke="#c8d3e0"/>
    <text x="54" y="288" fill="#333333">Capture + source review</text>
    <text x="54" y="306" fill="#777777">customers redirected</text>
    <line x1="302" y1="294" x2="326" y2="294" stroke="#9aa7b8" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="330" y="264" width="290" height="60" rx="7" fill="#ffffff" stroke="#c8d3e0"/>
    <text x="344" y="288" font-weight="700" fill="#1a3c5e">Default admin password guessed</text>
    <text x="344" y="306" fill="#777777">malware redirect injected, owner locked out</text>
    <line x1="622" y1="294" x2="646" y2="294" stroke="#9aa7b8" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="650" y="264" width="190" height="60" rx="7" fill="#f4f7f1" stroke="#bcd0bc"/>
    <text x="664" y="294" font-weight="700" fill="#2e7d46">MFA on admin</text>
    <text x="664" y="311" fill="#333333">+ strong password policy</text>

    <!-- row 4 ICMP -->
    <rect x="40" y="336" width="260" height="60" rx="7" fill="#f7f9fb" stroke="#c8d3e0"/>
    <text x="54" y="360" fill="#333333">ICMP flood capture</text>
    <text x="54" y="378" fill="#777777">internal network down (NIST CSF)</text>
    <line x1="302" y1="366" x2="326" y2="366" stroke="#9aa7b8" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="330" y="336" width="290" height="60" rx="7" fill="#ffffff" stroke="#c8d3e0"/>
    <text x="344" y="360" font-weight="700" fill="#1a3c5e">Unconfigured firewall</text>
    <text x="344" y="378" fill="#777777">no rate limit, no source checks</text>
    <line x1="622" y1="366" x2="646" y2="366" stroke="#9aa7b8" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="650" y="336" width="190" height="60" rx="7" fill="#f4f7f1" stroke="#bcd0bc"/>
    <text x="664" y="366" font-weight="700" fill="#2e7d46">Rate-limit + filter</text>
    <text x="664" y="383" fill="#333333">ICMP hardening</text>
  </g>

  <text x="40" y="430" font-size="12" fill="#777777">Two outages were denial of service, one a DNS failure, one a credential compromise: different causes, each read from</text>
  <text x="40" y="448" font-size="12" fill="#777777">the same discipline of separating symptom from cause before naming a fix.</text>
</svg>
